
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - EduScience</title>
    <link rel="stylesheet" href="../pages/style.css">
</head>
<body>
    <header>
        <h1>EduScience</h1>
        <p>Cadastro de clientes</p>
    </header>

    <main>
        <h2>Crie sua conta</h2>

        <form id="cadastro">
            <input id="nome" placeholder="Nome completo" required>
            <input id="email" type="email" placeholder="E-mail" required>
            <input id="senha" type="password" placeholder="Senha" minlength="6" required>
            <button>Cadastrar</button>
        </form>

        <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
    </main>

    <script>
        document.getElementById("cadastro").onsubmit = async (evento) => {
            evento.preventDefault();

            try {
                const resposta = await fetch("http://localhost:3000/cadastro", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nome: document.getElementById("nome").value,
                        email: document.getElementById("email").value,
                        senha: document.getElementById("senha").value
                    })
                });

                const dados = await resposta.json();
                alert(dados.mensagem || dados.erro);

                if (resposta.ok) {
                    window.location.href = "login.html";
                }
            } catch (erro) {
                alert("Não foi possível conectar ao servidor.");
            }
        };
    </script>
</body>
</html>
